name: Backtest

# Manual only — never on a schedule. Open the Actions tab, pick this workflow,
# click "Run workflow", then read the results in the job log.
on:
  workflow_dispatch:
    inputs:
      source:
        description: "Data source (yahoo = years of free history, no key)"
        default: "yahoo"
        type: choice
        options: ["yahoo", "twelvedata"]
      exec_tf:
        description: "Which timeframe fires entries. Use 1D or 4H with yahoo for a long test."
        default: "4H"
        type: choice
        options: ["3m", "15m", "30m", "4H", "1D"]
      bars:
        description: "Bars to download (twelvedata only; yahoo returns its maximum)"
        default: "2000"
      with_cot:
        description: "Include real CFTC COT history"
        default: true
        type: boolean
      trend_filter:
        description: "Refuse trades that fight the primary trend (untick to compare)"
        default: true
        type: boolean

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run backtest
        run: |
          python backtest.py \
            --source "${{ inputs.source }}" \
            --exec-tf "${{ inputs.exec_tf }}" \
            --bars "${{ inputs.bars }}" \
            --refresh \
            ${{ inputs.with_cot && '--with-cot' || '' }} \
            ${{ inputs.trend_filter && ' ' || '--no-trend-filter' }} \
            --csv trades.csv
        env:
          SYMBOL: XAU/USD
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
      - name: Save the trade list
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-trades
          path: trades.csv
          if-no-files-found: ignore
