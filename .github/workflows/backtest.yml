name: Backtest

# Manual only — never on a schedule. Open the Actions tab, pick this workflow,
# click "Run workflow", then read the results in the job log.
on:
  workflow_dispatch:
    inputs:
      exec_tf:
        description: "Execution timeframe (which TF triggers entries)"
        default: "15m"
        type: choice
        options: ["3m", "15m", "30m", "4H"]
      bars:
        description: "Bars of history to download (more = longer test)"
        default: "2000"
      with_cot:
        description: "Include real CFTC COT history"
        default: true
        type: boolean

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run backtest
        run: |
          python backtest.py \
            --exec-tf "${{ inputs.exec_tf }}" \
            --bars "${{ inputs.bars }}" \
            --refresh \
            ${{ inputs.with_cot && '--with-cot' || '' }} \
            --csv trades.csv
        env:
          SYMBOL: XAU/USD
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
      - name: Save the trade list
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-trades
          path: trades.csv
          if-no-files-found: ignore
