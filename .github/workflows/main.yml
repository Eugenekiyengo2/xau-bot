name: XAU confluence bot

on:
  # GitHub's own scheduler never fired a single run here, across three different
  # cron expressions and after clearing the billing block, so scheduling is done
  # externally instead and this workflow only responds to being triggered.
  workflow_dispatch: {}
  repository_dispatch:
    types: [run-bot]

# needed so the run can commit journal.csv back to the repository
permissions:
  contents: write

jobs:
  analyse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: last_state.json
          key: xau-state-${{ github.run_id }}
          restore-keys: xau-state-
      # Candle cache. Each run is a fresh machine, so without this every check
      # would re-download the weekly and daily charts that have not changed.
      - uses: actions/cache@v4
        with:
          path: tfcache
          key: xau-tfcache-${{ github.run_id }}
          restore-keys: xau-tfcache-
      - run: pip install -r requirements.txt
      - run: python run_once.py
        env:
          SOURCE: data
          SYMBOLS: "XAU/USD,EUR/USD,GBP/USD,USD/JPY"
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          USE_COT: "true"
          USE_CALENDAR: "true"
          ALERT_ON: actionable
          TP_COUNT: "6"
          SWEEP_LOOKBACK: "30"
          KILLZONES: "7-11,12-16"
          PRECISION_ENTRY: "true"
          REQUIRE_MSS: "true"
          LEVERAGE: "500"
          RISK_PCT: "0.214"
          ACCOUNT_BALANCE: "1000"

      # The forward-test record. Each run is a fresh machine, so the journal only
      # survives by being committed back. Pull-rebase first because runs can overlap.
      - name: Save the signal journal
        if: always()
        run: |
          if ls *_journal.csv >/dev/null 2>&1 && [ -n "$(git status --porcelain -- '*_journal.csv')" ]; then
            git config user.name  "xau-bot"
            git config user.email "actions@users.noreply.github.com"
            git add ./*_journal.csv
            git commit -m "journal: update $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
            git push origin HEAD:${{ github.ref_name }} || echo "push skipped"
          else
            echo "journal unchanged"
          fi
